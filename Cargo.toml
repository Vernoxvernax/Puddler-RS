[package]
name = "puddler"
version = "0.7.1"
edition = "2024"

[profile.release]
codegen-units = 1
strip = true
panic = "abort"
lto = true

[dependencies]
async-trait = "0.1.89"
chrono = { version = "0.4.44", features = ["serde"] }
clap = "4.6.1"
colored = "3.1.1"
config = "0.15.22"
crossterm = "0.29.0"
dirs = "6.0.0"
discord-presence = "3.2.0"
futures = "0.3.32"
isolanguage-1 = { version = "0.2.3", git = "https://github.com/Vernoxvernax/isolanguage-1.git" }
libmpv2 = { git = "https://github.com/Vernoxvernax/libmpv2-rs.git", version = "5.0.1" }
regex = "1.12.3"
reqwest = { version = "0.13.3", features = ["blocking"] }
serde = "1.0.228"
serde_derive = "1.0.228"
serde_json = "1.0.149"
tokio = { version = "1.52.2", features = ["full"] }
tokio-tungstenite = { version = "0.29.0", features = ["native-tls"] }
toml = "1.1.2+spec-1.1.0"
urlencoding = "2.1.3"
uuid = { version = "1.23.1", features = ["v4"] }

[target.'cfg(windows)'.dependencies]
libmpv2 = { git = "https://github.com/Vernoxvernax/libmpv2-rs.git", version = "5.0.1", features = ["build_libmpv"] }
