[package]
name = "puddler"
version = "0.7.1"
edition = "2024"

[profile.release]
codegen-units = 1
strip = true
panic = "abort"
lto = true

[dependencies]
async-trait = "0.1.92"
chrono = { version = "0.4.45", features = ["serde"] }
clap = "4.6.6"
colored = "3.1.1"
config = "0.15.25"
crossterm = "0.29.0"
dirs = "7.0.0"
discord-presence = "3.2.0"
futures = "0.3.34"
isolanguage-1 = { version = "0.2.3", git = "https://github.com/Vernoxvernax/isolanguage-1.git" }
libmpv2 = { git = "https://github.com/Vernoxvernax/libmpv2-rs.git", version = "5.0.1" }
regex = "1.13.1"
reqwest = { version = "0.13.5", features = ["blocking"] }
serde = "1.0.229"
serde_derive = "1.0.229"
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["full"] }
tokio-tungstenite = { version = "0.30.0", features = ["native-tls"] }
toml = "1.1.6"
urlencoding = "2.1.3"
uuid = { version = "1.26.1", features = ["v4"] }

[target.'cfg(windows)'.dependencies]
libmpv2 = { git = "https://github.com/Vernoxvernax/libmpv2-rs.git", version = "5.0.1", features = ["build_libmpv"] }
